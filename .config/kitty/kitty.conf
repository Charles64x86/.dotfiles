# vim:fileencoding=utf-8:foldmethod=marker

# BEGIN_KITTY_FONTS
font_family      family="FiraMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

font_size 14
disable_ligatures always

scrollback_lines 1000
mouse_hide_wait 3.0
enable_audio_bell no

window_margin_width 1

background #062329
foreground #AFA891

selection_foreground #21E278
selection_background #306750

cursor #21E278
cursor_shape block

